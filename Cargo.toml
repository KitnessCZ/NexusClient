[package]
name = "nexusclient"
version = "0.1.0"
edition = "2021"
description = "NexusClient - a Rust-based Minecraft Java client foundation"
license = "MIT"

[dependencies]
macroquad = "0.4.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.android]
package_name = "com.nexusclient.app"
label = "NexusClient"
build_targets = ["aarch64-linux-android"]
android_version = 35
min_sdk_version = 21
target_sdk_version = 35
fullscreen = false

[package.metadata.android.activity_attributes]
"android:exported" = "true"
