
[package]
name = "nexusclient"
version = "0.1.0"
edition = "2021"
description = "NexusClient - a Rust-based Minecraft Java client foundation"
license = "MIT"
autobins = false

[lib]
name = "nexusclient"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
winit = { version = "0.30.13", features = ["android-native-activity"] }
pollster = "0.4"
bytemuck = { version = "1.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha1 = "0.10"

[package.metadata.android]
package = "com.nexusclient.app"
build_targets = ["aarch64-linux-android"]
manifest_override = "android/AndroidManifest.xml"
include_cplusplus_shared = true

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "NexusClient"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "nexusclient"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
