
name: Build NexusClient with Horizon

on:
  push:
    branches:
      - horizon-native-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Horizon Android engine
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout NexusClient and Starling submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 platforms;android-36 ndk;28.2.13676358"

      - name: Install Rust and Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build Horizon Android APK
        shell: bash
        run: |
          set -euo pipefail
          python3 vendor/starling/packaging/android/build_apk.py \
            --abi arm64-v8a \
            --profile quick \
            --preview

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusClient-Horizon-ARM64
          path: vendor/starling/target/android/starling-preview-*.apk
          if-no-files-found: error
          retention-days: 14
