name: Build NexusClient APK

on:
  push:
    branches:
      - main
      - wgpu-migration
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "28.2.13676358"

jobs:
  android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

          test -d "$NDK_PATH"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

          rustup target add aarch64-linux-android

          rustc --version
          cargo --version

      - name: Install cargo-apk2
        run: cargo +1.95.0 install --locked cargo-apk2

      - name: Build NexusClient APK
        shell: bash
        run: |
          set -euo pipefail
          cargo apk2 build --release

      - name: Verify APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find target -type f -name '*.apk' \
            ! -name '*unaligned.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            find target -type f -print || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload NexusClient APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusClient-WGPU-Android-ARM64
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14